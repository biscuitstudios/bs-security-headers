<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="BS Security Headers">
	<title>BS Security Headers</title>
	<!--
		Tabler Icons "shield-check", MIT licensed (https://tabler.io/icons).
		Drawn on a 24x24 grid, scaled 7x and centred on a 256 canvas, which
		keeps the original stroke weight ratio (2/24 of the glyph box).

		The source icon uses stroke="currentColor". That is no use here: core
		renders a plugin icon as <img src="...">, so the SVG is its own
		document with nothing to inherit a colour from, and currentColor would
		fall back to black. The stroke is set explicitly instead.

		The tile and the glyph transform are identical across the other Biscuit
		plugins, so the icons read as one set in the plugins list. That is why
		this is a grey tile with a black stroke and not Biscuit orange: the set
		is the design system here, and one orange tile among four grey ones
		would read as a different product rather than a consistent one.
	-->
	<rect width="256" height="256" rx="56" fill="#ebebeb" />
	<g transform="translate(44 44) scale(7)"
	   fill="none"
	   stroke="#000000"
	   stroke-width="2"
	   stroke-linecap="round"
	   stroke-linejoin="round">
		<path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3" />
		<path d="M9 12l2 2l4 -4" />
	</g>
</svg>
